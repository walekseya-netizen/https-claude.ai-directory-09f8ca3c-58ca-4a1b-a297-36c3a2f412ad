# Развёртывание во Fly.io: fly launch --no-deploy, затем fly deploy
app = "ks-service"
primary_region = "fra"

[build]

[env]
  KS_DATABASE_PATH = "/data/ks.sqlite3"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# Том для базы: fly volumes create ks_data --size 1 --region fra
[mounts]
  source = "ks_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
